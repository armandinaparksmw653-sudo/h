name: pilot-curated-evaluation

# Manual only: runs the small, checked-in hand-curated pilot fixture
# (evaluation/pilot-curated-wimcor/, four real WiMCor sentences whose
# metonymy target resolves to one real Wikidata entity) through the real
# formal contextual tower -- constraint derivation, layered
# ContextConstraint filtering, Agda-checked runtimeCheck -- to answer
# concretely whether the system accepts/rejects each one, not just
# whether a GF tree can be built for it. Unlike
# contextual-tower-evaluation.yml, this never downloads WiMCor/ConMeC at
# runtime and never scans the live Wikidata API -- the fixture and its
# snapshot are both small, already checked in, and safe (four real
# sentences reproduced under WiMCor's CC BY-SA 3.0 terms, not a bulk
# corpus dump; see evaluation/pilot-curated-wimcor/README.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGDA_RTS: +RTS -M6G -RTS
      STANZA_MODEL_DIR: /home/runner/.cache/metonymy/stanza/models
    steps:
      - uses: actions/checkout@v5

      - name: Cache Cubical and GF RGL
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/metonymy/cubical-v0.5
            ~/.cache/metonymy/gf-rgl-20260403
            ~/.cache/metonymy/gf-rgl-lib
          key: metonymy-${{ runner.os }}-132a2a3-e825d92-gf312

      - name: Cache Stanza package and models
        uses: actions/cache@v5
        with:
          path: ~/.cache/metonymy/stanza
          key: stanza-${{ runner.os }}-${{ hashFiles('toolchain.lock.json') }}

      - name: Install pinned system toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends agda-bin cabal-install curl ghc git make ripgrep
          curl -L \
            "https://github.com/GrammaticalFramework/gf-core/releases/download/release-3.12/gf-3.12-ubuntu-24.04.deb" \
            -o /tmp/gf.deb
          echo "17aa5452b713f1e00a0755a1bad998a926acbffb96eefde2c3800ca72536b4d8  /tmp/gf.deb" \
            | sha256sum -c -
          sudo apt-get install -y /tmp/gf.deb

      - name: Build and verify (same as ci.yml)
        run: ./scripts/reproduce.sh

      - name: Install dependency-frontend toolchain (Stanza)
        run: ./scripts/bootstrap_dependency_frontend.sh

      - name: Run the contextual tower on the pilot fixture
        run: |
          python3 scripts/evaluation/run_contextual_corpus.py \
            --dataset evaluation/pilot-curated-wimcor/pilot-sentences.jsonl \
            --engine build/metonymy \
            --snapshot evaluation/pilot-curated-wimcor/wikidata-snapshot \
            --workers 2 \
            --allow-failures \
            --print-failures \
            --output build/evaluation/pilot-curated.tower-inference.jsonl

      - name: Score metonymic-vs-literal detection
        run: |
          python3 scripts/evaluation/score_contextual_detection.py \
            --inference build/evaluation/pilot-curated.tower-inference.jsonl \
            --gold evaluation/pilot-curated-wimcor/pilot-gold.jsonl \
            --output build/evaluation/pilot-curated.tower-detection-report.json

      - name: Summarize
        run: |
          {
            echo "## Hand-curated pilot evaluation (4 real WiMCor sentences)"
            echo "See evaluation/pilot-curated-wimcor/README.md for what each row is."
            echo '```json'
            python3 -m json.tool "build/evaluation/pilot-curated.tower-detection-report.json"
            echo '```'
            echo '### Per-row inference (safe -- only 4 hand-picked, already-published sentences)'
            echo '```json'
            cat build/evaluation/pilot-curated.tower-inference.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full inference (safe -- fixture is 4 rows, already public)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-curated-evaluation-results
          path: |
            build/evaluation/pilot-curated.tower-inference.jsonl
            build/evaluation/pilot-curated.tower-detection-report.json
          retention-days: 30
